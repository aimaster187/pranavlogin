# PRANAV Domain & Subdomain Nginx Reverse Proxy Configuration
# Covers: pranavsmm.shop, admin.pranavsmm.shop, api.pranavsmm.shop, bot.pranavsmm.shop
# Obtain TLS certificates on VPS with:
#   sudo certbot --nginx -d pranavsmm.shop -d admin.pranavsmm.shop -d api.pranavsmm.shop -d bot.pranavsmm.shop

limit_req_zone $binary_remote_addr zone=pranav_api_limit:10m rate=20r/s;

server {
    listen 80;
    server_name pranavsmm.shop admin.pranavsmm.shop api.pranavsmm.shop bot.pranavsmm.shop;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.pranavsmm.shop bot.pranavsmm.shop;

    # Certbot populates ssl_certificate & ssl_certificate_key after issuance
    # ssl_certificate /etc/letsencrypt/live/pranavsmm.shop/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/pranavsmm.shop/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        limit_req zone=pranav_api_limit burst=40 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

server {
    listen 443 ssl http2;
    server_name pranavsmm.shop admin.pranavsmm.shop;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /api/ {
        limit_req zone=pranav_api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        default_type text/plain;
        return 200 "PRANAV Control Plane — Primary management console runs on the native PRANAV Android Admin APK.\n";
    }
}
