name: PRANAV Complete Build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  complete-build:
    name: Build Admin APK, PRANAV DEX and Hook Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Install Android SDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$ANDROID_HOME/platform-tools:$PATH"
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend dependencies and test
        working-directory: PRANAV/backend
        run: |
          npm install
          npm test

      - name: Verify persistent debug signing key
        run: |
          test -f debug.keystore
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey

      - name: Build PRANAV DEX and Hook-integrated sample APK
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          chmod +x PRANAV/dex/build-dex.sh PRANAV/tests/build_and_verify_sample_apk.sh
          bash PRANAV/dex/build-dex.sh
          bash PRANAV/tests/build_and_verify_sample_apk.sh

      - name: Run Admin Android tests
        continue-on-error: true
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build Admin APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload all build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PRANAV-COMPLETE-BUILD
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            PRANAV/dex/build/pranav-sdk-1.4.0.dex
            PRANAV/dex/build/pranav-sdk-1.4.0.dex.sha256
            PRANAV/tests/output/sample-apk/sample-pranav-integrated.apk
          if-no-files-found: error
          retention-days: 14
